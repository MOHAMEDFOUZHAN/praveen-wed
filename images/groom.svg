<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="bgGradGroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9ed"/>
      <stop offset="50%" stop-color="#fdf2d9"/>
      <stop offset="100%" stop-color="#f5e1b5"/>
    </linearGradient>
    
    <linearGradient id="skinGradGroom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c79b"/>
      <stop offset="100%" stop-color="#e2aa76"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd978"/>
      <stop offset="50%" stop-color="#d4a340"/>
      <stop offset="100%" stop-color="#996f1b"/>
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4eedb"/>
    </linearGradient>

    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a81c3b"/>
      <stop offset="100%" stop-color="#6b0d21"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4a1525" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="520" rx="16" fill="url(#bgGradGroom)"/>
  
  <!-- Subtle Mandala Ring Backdrop -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#d4a340" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#d4a340" stroke-width="1" stroke-dasharray="2,8" opacity="0.3"/>
  <circle cx="200" cy="200" r="120" fill="rgba(255,255,255,0.4)"/>

  <!-- Decorative Hanging Toran / Garland at top -->
  <g opacity="0.6">
    <path d="M 20 0 Q 70 30 120 0 Q 170 30 220 0 Q 270 30 320 0 Q 370 30 400 0" fill="none" stroke="#d4a340" stroke-width="2"/>
    <circle cx="70" cy="22" r="6" fill="#e67e22"/>
    <circle cx="170" cy="22" r="6" fill="#e67e22"/>
    <circle cx="270" cy="22" r="6" fill="#e67e22"/>
    <circle cx="370" cy="22" r="6" fill="#e67e22"/>
  </g>

  <!-- GROOM CHARACTER -->
  <g filter="url(#softShadow)">
    <!-- Body / Shoulders / Silk Shirt -->
    <path d="M 100 400 C 100 330, 130 300, 200 300 C 270 300, 300 330, 300 400 L 320 520 L 80 520 Z" fill="url(#shirtGrad)"/>
    
    <!-- Shirt Collar -->
    <path d="M 160 295 L 200 340 L 240 295 L 225 285 L 200 310 L 175 285 Z" fill="#ffffff" stroke="#d4a340" stroke-width="1.5"/>
    <line x1="200" y1="340" x2="200" y2="520" stroke="#d4a340" stroke-width="2" stroke-dasharray="8,6"/>
    <!-- Gold buttons -->
    <circle cx="200" cy="370" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="200" cy="410" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="200" cy="450" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="200" cy="490" r="3.5" fill="url(#goldGrad)"/>

    <!-- Angavastram (Silk Shawl over shoulder) -->
    <path d="M 230 300 C 250 310, 280 340, 285 410 L 305 520 L 265 520 L 245 410 C 240 360, 225 320, 215 305 Z" fill="url(#shirtGrad)" stroke="#d4a340" stroke-width="1.5"/>
    <!-- Angavastram Gold Border Work -->
    <path d="M 275 390 L 295 520 L 280 520 L 260 390 Z" fill="url(#goldGrad)"/>
    <line x1="285" y1="410" x2="270" y2="410" stroke="#6b0d21" stroke-width="2"/>
    <line x1="288" y1="440" x2="273" y2="440" stroke="#6b0d21" stroke-width="2"/>
    <line x1="291" y1="470" x2="276" y2="470" stroke="#6b0d21" stroke-width="2"/>

    <!-- Neck -->
    <path d="M 175 250 L 175 300 C 175 315, 225 315, 225 300 L 225 250 Z" fill="url(#skinGradGroom)"/>
    <!-- Gold Chain -->
    <path d="M 172 285 Q 200 325 228 285" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="200" cy="316" r="5" fill="url(#goldGrad)"/>

    <!-- Ears -->
    <ellipse cx="128" cy="195" rx="12" ry="18" fill="url(#skinGradGroom)"/>
    <ellipse cx="128" cy="195" rx="6" ry="10" fill="#d99764"/>
    <ellipse cx="272" cy="195" rx="12" ry="18" fill="url(#skinGradGroom)"/>
    <ellipse cx="272" cy="195" rx="6" ry="10" fill="#d99764"/>

    <!-- Head / Face -->
    <path d="M 135 170 C 135 110, 265 110, 265 170 C 265 245, 240 265, 200 265 C 160 265, 135 245, 135 170 Z" fill="url(#skinGradGroom)"/>

    <!-- Cute Blush on Cheeks -->
    <ellipse cx="155" cy="205" rx="12" ry="7" fill="#ff7675" opacity="0.35"/>
    <ellipse cx="245" cy="205" rx="12" ry="7" fill="#ff7675" opacity="0.35"/>

    <!-- Eyes (Cute, big & smiling) -->
    <ellipse cx="168" cy="180" rx="9" ry="11" fill="#2d3436"/>
    <ellipse cx="232" cy="180" rx="9" ry="11" fill="#2d3436"/>
    <!-- Eye Highlights -->
    <circle cx="165" cy="176" r="3.5" fill="#ffffff"/>
    <circle cx="171" cy="183" r="1.5" fill="#ffffff"/>
    <circle cx="229" cy="176" r="3.5" fill="#ffffff"/>
    <circle cx="235" cy="183" r="1.5" fill="#ffffff"/>

    <!-- Cute Eyebrows -->
    <path d="M 152 162 Q 168 152 182 160" fill="none" stroke="#1e272e" stroke-width="4" stroke-linecap="round"/>
    <path d="M 218 160 Q 232 152 248 162" fill="none" stroke="#1e272e" stroke-width="4" stroke-linecap="round"/>

    <!-- Sacred Tilak / Chandan & Kumkum Pottu -->
    <path d="M 194 135 L 206 135 L 203 150 L 197 150 Z" fill="#ffffff"/>
    <circle cx="200" cy="148" r="3" fill="#c0392b"/>

    <!-- Nose -->
    <path d="M 200 180 Q 204 195 198 198 Q 194 198 194 195" fill="none" stroke="#c88350" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cute Mustache & Gentle Smile -->
    <path d="M 178 214 Q 192 208 200 216 Q 208 208 222 214 Q 212 222 200 220 Q 188 222 178 214 Z" fill="#1e272e"/>
    <path d="M 188 225 Q 200 238 212 225" fill="none" stroke="#b33939" stroke-width="3" stroke-linecap="round"/>

    <!-- Stylish Hair -->
    <path d="M 132 165 C 130 115, 150 85, 200 85 C 250 85, 270 115, 268 165 C 260 140, 245 130, 200 130 C 155 130, 140 140, 132 165 Z" fill="#1e272e"/>
    <!-- Hair Volume Puff Top -->
    <path d="M 145 105 C 150 75, 180 65, 200 65 C 225 65, 255 75, 255 105 C 245 92, 225 85, 200 85 C 175 85, 155 92, 145 105 Z" fill="#2c3e50"/>

    <!-- WEDDING GARLAND (மாலை / Rose & Jasmine Garland) -->
    <!-- Left Garland String -->
    <g>
      <!-- Jasmine & Rose segments left -->
      <ellipse cx="140" cy="320" rx="14" ry="12" fill="#ffffff" stroke="#e0d6be" stroke-width="1"/>
      <ellipse cx="135" cy="340" rx="15" ry="13" fill="url(#maroonGrad)"/>
      <ellipse cx="130" cy="365" rx="16" ry="14" fill="#ffffff" stroke="#e0d6be" stroke-width="1"/>
      <ellipse cx="128" cy="395" rx="17" ry="15" fill="url(#goldGrad)"/>
      <ellipse cx="130" cy="425" rx="16" ry="14" fill="url(#maroonGrad)"/>
      <ellipse cx="135" cy="455" rx="16" ry="14" fill="#ffffff" stroke="#e0d6be" stroke-width="1"/>
      <ellipse cx="145" cy="485" rx="17" ry="15" fill="url(#maroonGrad)"/>

      <!-- Jasmine & Rose segments right -->
      <ellipse cx="260" cy="320" rx="14" ry="12" fill="#ffffff" stroke="#e0d6be" stroke-width="1"/>
      <ellipse cx="265" cy="340" rx="15" ry="13" fill="url(#maroonGrad)"/>
      <ellipse cx="270" cy="365" rx="16" ry="14" fill="#ffffff" stroke="#e0d6be" stroke-width="1"/>
      <ellipse cx="272" cy="395" rx="17" ry="15" fill="url(#goldGrad)"/>
      <ellipse cx="270" cy="425" rx="16" ry="14" fill="url(#maroonGrad)"/>
      <ellipse cx="265" cy="455" rx="16" ry="14" fill="#ffffff" stroke="#e0d6be" stroke-width="1"/>
      <ellipse cx="255" cy="485" rx="17" ry="15" fill="url(#maroonGrad)"/>

      <!-- Garland Bottom Center Knot / Pendant -->
      <circle cx="200" cy="505" r="16" fill="url(#maroonGrad)"/>
      <circle cx="200" cy="505" r="10" fill="url(#goldGrad)"/>
      <!-- Hanging Tassels -->
      <path d="M 194 515 L 190 540 L 210 540 L 206 515 Z" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- Sparkles & Floating Hearts/Petals -->
  <g fill="#d4a340">
    <path d="M 60 140 Q 65 150 75 150 Q 65 150 60 160 Q 55 150 45 150 Q 55 150 60 140 Z"/>
    <path d="M 340 150 Q 344 158 352 158 Q 344 158 340 166 Q 336 158 328 158 Q 336 158 340 150 Z"/>
    <circle cx="75" cy="220" r="3" fill="#ff7675"/>
    <circle cx="330" cy="240" r="3.5" fill="#ff7675"/>
  </g>

  <!-- Cute Badge Label at bottom -->
  <g transform="translate(145, 480)">
    <rect width="110" height="28" rx="14" fill="#4d0717" stroke="#d4a340" stroke-width="1.5"/>
    <text x="55" y="18" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#ffd978" text-anchor="middle" letter-spacing="2">GROOM</text>
  </g>
</svg>
